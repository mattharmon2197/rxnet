<script>
/* ---------- CLOSE POPUP ---------- */
function closePopup() {
  const existing = document.querySelector(".popup-overlay");
  if (existing) existing.remove();
}

/* ---------- OPEN DEA CHECKER ---------- */
function openDEAChecker() {
  closePopup();

  const overlay = document.createElement("div");
  overlay.className = "popup-overlay";

  overlay.innerHTML = `
    <div class="popup-box">
      <h3>DEA Number Validator</h3>

      <input
        type="text"
        id="deaInput"
        placeholder="Enter DEA Number"
        style="padding:8px; width:80%; font-size:1rem; text-transform:uppercase;"
        onkeydown="if (event.key === 'Enter') validateDEA();"
      />

      <br><br>

      <button id="deaValidateButton" onclick="validateDEA()">
        Validate
      </button>

      <button onclick="closePopup()">
        Cancel
      </button>

      <div id="deaResult" style="margin-top:15px; font-size:0.95rem;"></div>
    </div>
  `;

  document.body.appendChild(overlay);

  const input = document.getElementById("deaInput");
  input.focus();
}

/* ---------- DEA VALIDATION ---------- */
function validateDEA() {

  const dea = document
    .getElementById("deaInput")
    .value
    .trim()
    .toUpperCase();

  const resultDiv = document.getElementById("deaResult");

  /* ----- BASIC FORMAT CHECK ----- */
  if (!/^[A-Z]{2}\d{7}$/.test(dea)) {
    resultDiv.innerHTML = `
      <div style="color:red;">
        Invalid format.<br>
        DEA numbers should be 2 letters followed by 7 digits.
      </div>
    `;
    return;
  }

  const digits = dea.substring(2);

  /* ----- DEA CHECKSUM ----- */
  const d1 = parseInt(digits[0]);
  const d2 = parseInt(digits[1]);
  const d3 = parseInt(digits[2]);
  const d4 = parseInt(digits[3]);
  const d5 = parseInt(digits[4]);
  const d6 = parseInt(digits[5]);
  const checkDigit = parseInt(digits[6]);

  const oddSum = d1 + d3 + d5;
  const evenSum = (d2 + d4 + d6) * 2;

  const total = oddSum + evenSum;

  const calculatedDigit = parseInt(
    total.toString().slice(-1)
  );

  /* ----- FINAL RESULT ----- */
  if (calculatedDigit === checkDigit) {

    resultDiv.innerHTML = `
      <div style="color:green; font-weight:bold;">
        DEA number appears valid.
      </div>

      <div style="margin-top:8px; font-size:0.85rem;">
        Format and checksum pass verification.<br>
        This does NOT confirm active registration status.
      </div>
    `;

  } else {

    resultDiv.innerHTML = `
      <div style="color:red; font-weight:bold;">
        DEA number failed checksum validation.
      </div>

      <div style="margin-top:8px; font-size:0.85rem;">
        The number is likely invalid or mistyped.
      </div>
    `;
  }
}
</script>
