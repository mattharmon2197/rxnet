<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RxNet Admin -- this is now a placeholder page, see the Admin tab on the home page for updated admin options</title>
    <style>
        /* Home button */
        .home-button {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #35BF8E;
            color: white;
            padding: 10px 40px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
        }

        .home-button:hover {
            background-color: #0f6658;
        }

        /* Centered site title */
        .site-title {
            font-size: 18pt;
            font-weight: bold;
            text-align: center;
            margin-top: 60px; /* Adjusted to allow space below Home button */
            color: black;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px 45px;
            padding: 10px;
            max-width: 90vw;
            margin: auto;
        }

        .link-button {
            flex: 1 1 16%;
            max-width: 300px;
            min-width: 70px;
            aspect-ratio: 12 / 1;
            background-color: #148275;
            color: white;
            padding: 14px;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            text-align: center;
            width: 100%;
            border-radius: 12px;
            justify-content: center;
            align-items: center;
            min-height: 15px;
        }

        .link-button:hover {
            background-color: #0f5d4f;
        }

        .show { display: grid; }
    </style>
</head>
<body>

    <a href="/rxnet/" class="home-button">Home</a>

    <h1 class="site-title">RxNet - Admin Home</h1>

    <div class="button-container">
        <a href="https://github.com/matthewstathis1/rxnet/blob/main/index.html" class="link-button">Modify Code</a>
        <a href="https://github.com/matthewstathis1/rxnet/deployments" class="link-button">Deployments</a>
        <a href="https://github.com/matthewstathis1/rxnet/tree/main" class="link-button">GitHub Main</a>
        <a href="/rxnet/backuphomedropdown.html" class="link-button">Dropdown Home</a>
        <a href="/rxnet/docs/rxnet.pdf" class="link-button">Site QR Code</a>
        <a href="/rxnet/placeholder" class="link-button">Placeholder Page</a>
        <a href="/rxnet/quicklinks" class="link-button">Quick Links</a>


    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let buttons = document.querySelectorAll(".link-button");
            buttons.forEach(button => {
                button.setAttribute("target", "_blank");
                button.setAttribute("rel", "noopener noreferrer");
            });
        });
    </script>
</body>
</html>
